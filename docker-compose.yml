name: batcomputer

services:
  # ---------------------------------------------------------------
  # PostgreSQL · conexión DBeaver:
  #   Host: localhost  Puerto: 5432  BD: batcomputer
  #   Usuario: batman  Contraseña: gotham
  # ---------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: batcomputer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: batman
      POSTGRES_PASSWORD: gotham
      POSTGRES_DB: batcomputer
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U batman -d batcomputer"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    container_name: batcomputer-api
    restart: unless-stopped
    environment:
      PORT: 4000
      PGHOST: db
      PGPORT: 5432
      PGUSER: batman
      PGPASSWORD: gotham
      PGDATABASE: batcomputer
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    container_name: batcomputer-web
    restart: unless-stopped
    environment:
      VITE_API_TARGET: http://api:4000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
